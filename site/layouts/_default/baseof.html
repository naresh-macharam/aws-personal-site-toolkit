<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family={{ .Site.Params.headingFont | default "Space+Grotesk:wght@400;500;600;700" }}&family={{ .Site.Params.bodyFont | default "Inter:wght@400;500;600" }}&family={{ .Site.Params.monoFont | default "JetBrains+Mono:wght@400;500" }}&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: {{ .Site.Params.colors.bg | default "#0B0F14" }};
    --surface: {{ .Site.Params.colors.surface | default "#121821" }};
    --surface-2: {{ .Site.Params.colors.surface2 | default "#1A222D" }};
    --border: {{ .Site.Params.colors.border | default "#26303B" }};
    --border-soft: {{ .Site.Params.colors.borderSoft | default "#1E2731" }};
    --ink: {{ .Site.Params.colors.ink | default "#F2F5F7" }};
    --ink-dim: {{ .Site.Params.colors.inkDim | default "#A9B4BE" }};
    --ink-faint: {{ .Site.Params.colors.inkFaint | default "#6C7784" }};
    --accent: {{ .Site.Params.colors.accent | default "#34D8A6" }};
    --accent-dim: {{ .Site.Params.colors.accentDim | default "#1E5B4C" }};
    --radius: 3px;
    --wrap: 1180px;
    --font-display: '{{ .Site.Params.headingFontName | default "Space Grotesk" }}', 'Inter', sans-serif;
    --font-body: '{{ .Site.Params.bodyFontName | default "Inter" }}', sans-serif;
    --font-mono: '{{ .Site.Params.monoFontName | default "JetBrains Mono" }}', monospace;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    background:var(--bg); color:var(--ink); font-family:var(--font-body);
    line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; text-decoration:none; }
  ul{ list-style:none; }
  h1,h2,h3{ font-family:var(--font-display); font-weight:600; letter-spacing:-0.01em; color:var(--ink); }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }
  .wrap{ max-width:var(--wrap); margin:0 auto; padding:0 32px; }
  @media (max-width:640px){ .wrap{ padding:0 20px; } }

  .eyebrow{
    font-family:var(--font-mono); font-size:12.5px; letter-spacing:.04em;
    color:var(--accent); display:flex; align-items:center; gap:10px; margin-bottom:22px;
  }
  .eyebrow::before{ content:''; width:7px; height:7px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 3px var(--accent-dim); }

  header{
    position:sticky; top:0; z-index:50;
    background:rgba(11,15,20,.9); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border-soft);
  }
  .nav{ display:flex; align-items:center; justify-content:space-between; height:68px; }
  .logo{ font-family:var(--font-mono); font-size:15px; font-weight:500; color:var(--ink); display:flex; align-items:center; gap:9px; }
  .logo .dot{ width:8px; height:8px; border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent); }
  .logo .path{ color:var(--ink-faint); }
  .nav-links{ display:flex; gap:36px; }
  .nav-links a{ font-size:14px; color:var(--ink-dim); transition:color .15s ease; }
  .nav-links a:hover, .nav-links a.active{ color:var(--accent); }

  main{ min-height:60vh; padding:64px 0 100px; }

  footer{ border-top:1px solid var(--border-soft); padding:32px 0; }
  .footer-row{
    display:flex; justify-content:space-between; align-items:center;
    font-family:var(--font-mono); font-size:12px; color:var(--ink-faint); flex-wrap:wrap; gap:12px;
  }
</style>
</head>
<body>

<header>
  <nav class="nav wrap">
    <a href="{{ .Site.Params.homeURL | default "/" }}" class="logo">
      <span class="dot"></span>{{ .Site.Params.logoText | default .Site.Title }}
    </a>
    <ul class="nav-links">
      {{ range .Site.Params.homeNavLinks }}
      <li><a href="{{ .url }}">{{ .label }}</a></li>
      {{ end }}
      <li><a href="/" class="active">Blog</a></li>
    </ul>
  </nav>
</header>

<main class="wrap">
  {{ block "main" . }}{{ end }}
</main>

<footer>
  <div class="wrap footer-row">
    <span>© {{ now.Format "2006" }} {{ .Site.Title }}</span>
    <span><a href="{{ .Site.Params.homeURL | default "/" }}">← Back to main site</a></span>
  </div>
</footer>

</body>
</html>
