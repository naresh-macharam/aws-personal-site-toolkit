name: Reusable - Deploy static homepage

# Called from a user's homepage repo via `uses:` — not run directly.
# Keeping deploy logic here means a bug fix or improvement reaches
# every fork's pipeline the next time their caller workflow runs,
# instead of everyone needing to manually re-copy an updated file.

on:
  workflow_call:
    inputs:
      role_arn:
        required: true
        type: string
      bucket_name:
        required: true
        type: string
      distribution_id:
        required: true
        type: string
      aws_region:
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.role_arn }}
          aws-region: ${{ inputs.aws_region }}

      - name: Sync homepage to S3 (never touches /blog/)
        run: |
          aws s3 sync . s3://${{ inputs.bucket_name }}/ \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "*.tf" \
            --exclude "blog/*" \
            --delete

      # Invalidate everything, not just the HTML. Anything else you
      # deploy (a resume PDF, images, CSS) would otherwise keep being
      # served from CloudFront's cache after the S3 upload succeeds.
      # "/*" counts as a single invalidation path, so it costs the
      # same as listing one file.
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ inputs.distribution_id }} \
            --paths "/*"
